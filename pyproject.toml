[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alt-celery2"
version = "1.0.0"
description = "基于 Docker 部署的生产级 Celery 应用：支持普通任务与定时任务，内置 Flower 监控。"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "gujiahui234" }]
keywords = ["celery", "docker", "redis", "task-queue", "flower"]
dependencies = [
    "celery>=5.5.0,<6.0.0",
    "redis>=5.2.0,<7.0.0",
    "flower>=2.0.1,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = false
ignore_missing_imports = true
